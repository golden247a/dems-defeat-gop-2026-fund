/* =========================================================
   Rendering (no need to edit below)
   ========================================================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ratingClass(r){
  const t = (r||"").toLowerCase();
  if(t.startsWith("toss")) return "toss";
  if(/\br$/.test(t)) return "rep";
  if(t.startsWith("lean")) return "lean";
  if(t.startsWith("likely")||t.startsWith("safe")) return "likely";
  return "unset";
}

function renderDaily(){
  const el = $("daily");
  if(!DAILY_PICTURES.length){
    el.innerHTML = '<div class="empty">Picture of the day: add images in DAILY_PICTURES.</div>';
    return;
  }
  const day = Math.floor(Date.now()/86400000);
  const p = DAILY_PICTURES[day % DAILY_PICTURES.length];
  el.innerHTML = `<img src="${esc(p.url)}" alt="${esc(p.caption||"Picture of the day")}">` +
    `<figcaption>${esc(p.caption||"")}${p.credit?` <span style="opacity:.8">— ${esc(p.credit)}</span>`:""}</figcaption>`;
}

function initials(name){ return name.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }

function cardHTML(c){
  const rating = c.rating || "Not set";
  const poll = c.poll
    ? `<div class="v">${esc(c.poll.value)} – ${esc(c.poll.opponent)}</div><div class="src">${esc(c.poll.source)}${c.poll.date?`, ${esc(c.poll.date)}`:""}</div>`
    : `<div class="v">—</div><div class="src">No poll added</div>`;
  const photo = c.photo
    ? `<img src="${esc(c.photo)}" alt="${esc(c.name)}" onerror="this.remove()">`
    : "";
  const donateReady = !!SETTINGS.donateUrl;
  const donate = donateReady
    ? `<a class="donate" href="${esc(SETTINGS.donateUrl)}" rel="noopener">Donate</a>`
    : `<a class="donate" aria-disabled="true" role="link" tabindex="-1">Donate link not set</a>`;
  return `
  <article class="card">
    <div class="photo"><div class="initials" aria-hidden="true">${esc(initials(c.name))}</div>${photo}</div>
    <div class="body">
      <h3>${esc(c.name)}</h3>
      <div class="race">${esc(c.state)} · ${esc(c.race)}</div>
      ${c.bio?`<p class="bio">${esc(c.bio)}</p>`:""}
      <div class="stats">
        <div class="stat"><div class="k">Race rating</div><div class="v"><span class="badge ${ratingClass(c.rating)}">${esc(rating)}</span></div>${c.ratingSource?`<div class="src">${esc(c.ratingSource)}</div>`:""}</div>
        <div class="stat"><div class="k">Latest poll</div>${poll}</div>
      </div>
      ${c.policies&&c.policies.length?`<ul class="policies">${c.policies.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
      ${donate}
      ${SETTINGS.donateNote?`<p class="donate-note">${esc(SETTINGS.donateNote)}</p>`:""}
      ${c.updated?`<p class="donate-note">Updated ${esc(c.updated)}</p>`:""}
      ${notesHTML(c)}
    </div>
  </article>`;
}

function candidateKey(c){ return (c.category+":"+c.name).toLowerCase().replace(/[^a-z0-9:]+/g,"-"); }

function notesHTML(c){
  const key = "notes:"+candidateKey(c);
  let saved = "";
  try{ saved = localStorage.getItem(key) || ""; }catch(e){}
  return `
  <div class="notes">
    <label for="${key}">Your notes</label>
    <textarea id="${key}" data-key="${key}" placeholder="Write anything you want to remember about this race…">${esc(saved)}</textarea>
    <div class="saved" data-savedfor="${key}">Saved</div>
  </div>`;
}

function render(){
  ["house","senate","governor"].forEach(cat=>{
    const items = CANDIDATES.filter(c=>c.category===cat);
    const html = items.length
      ? items.map(c => cardHTML(c) ).join("")
      : '<p class="none">No candidates added yet.</p>';
    $("page-"+cat).innerHTML = html;
  });
  $("disclaimer").innerHTML = SETTINGS.paidForBy
    ? `<strong>${esc(SETTINGS.paidForBy)}</strong>`
    : "Add your “paid for by” disclaimer in SETTINGS.paidForBy.";
  wireNotes();
  renderArticles();
}

/* ---------- Articles: general election-race writeups, not tied to one candidate ----------
   Saved in this visitor's own browser only (localStorage) — like the notes boxes, these are
   NOT shared with you or with other visitors. To publish articles everyone sees, they'd need
   to go in this file's data (or a small backend) instead. */
function loadArticles(){
  try{ return JSON.parse(localStorage.getItem("articles") || "[]"); }catch(e){ return []; }
}
function saveArticles(list){
  try{ localStorage.setItem("articles", JSON.stringify(list)); }catch(e){}
}

function renderArticles(){
  const host = $("page-articles");
  const list = loadArticles();
  const formHTML = `
    <div class="add-article">
      <h3>Add an article</h3>
      <input id="art-title" type="text" placeholder="Headline">
      <div class="row">
        <input id="art-source" type="text" placeholder="Source (e.g. AP News)">
        <input id="art-url" type="url" placeholder="Link (optional)">
      </div>
      <textarea id="art-body" placeholder="Paste the article text, or your own summary…"></textarea>
      <button type="button" id="art-add-btn">Add article</button>
    </div>`;
  const cardsHTML = list.length
    ? list.slice().reverse().map(a => `
      <article class="article-card" data-id="${esc(a.id)}">
        <h3>${esc(a.title || "Untitled")}</h3>
        <div class="meta">${esc(a.source||"")}${a.date?` · ${esc(a.date)}`:""}</div>
        ${a.body ? `<div class="body">${esc(a.body)}</div>` : ""}
        ${a.url ? `<a class="src-link" href="${esc(a.url)}" target="_blank" rel="noopener">Read source ↗</a>` : ""}
        <br><button type="button" class="remove" data-remove="${esc(a.id)}" style="margin-top:10px;background:none;border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-family:'Archivo',sans-serif;font-size:12.5px;color:var(--muted);cursor:pointer">Remove</button>
      </article>`).join("")
    : '<p class="none">No articles added yet.</p>';

  host.innerHTML = formHTML + cardsHTML;

  $("art-add-btn").addEventListener("click", ()=>{
    const title = $("art-title").value.trim();
    const source = $("art-source").value.trim();
    const url = $("art-url").value.trim();
    const body = $("art-body").value.trim();
    if(!title && !body) return;
    const items = loadArticles();
    items.push({
      id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
      title, source, url, body,
      date: new Date().toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})
    });
    saveArticles(items);
    renderArticles();
  });

  host.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.remove;
      saveArticles(loadArticles().filter(a=>a.id!==id));
      renderArticles();
    });
  });
}

function wireNotes(){
  document.querySelectorAll(".notes textarea").forEach(ta=>{
    ta.addEventListener("input", ()=>{
      const key = ta.dataset.key;
      try{ localStorage.setItem(key, ta.value); }catch(e){}
      const flag = document.querySelector(`.saved[data-savedfor="${key}"]`);
      if(flag){
        flag.classList.add("show");
        clearTimeout(flag._t);
        flag._t = setTimeout(()=>flag.classList.remove("show"), 1200);
      }
    });
  });
}

function setActiveTab(cat){
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    const on = b.dataset.cat===cat;
    b.classList.toggle("active", on);
    b.setAttribute("aria-selected", on ? "true":"false");
  });
  document.querySelectorAll("main .page").forEach(p=>{
    p.classList.toggle("active", p.id === "page-"+cat);
  });
  try{ localStorage.setItem("activeTab", cat); }catch(e){}
}

function initTabs(){
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.addEventListener("click", ()=>setActiveTab(b.dataset.cat));
  });
  let start = "house";
  try{ start = localStorage.getItem("activeTab") || "house"; }catch(e){}
  setActiveTab(start);
}

async function loadFeed(){
  if(!SETTINGS.feedUrl) return;
  try{
    const r = await fetch(SETTINGS.feedUrl, {cache:"no-store"});
    if(r.ok){ CANDIDATES = await r.json(); }
  }catch(e){ /* keep in-file data */ }
}

renderDaily();
render();
initTabs();
loadFeed().then(()=>{render(); initTabs();});
setInterval(()=>loadFeed().then(render), 5*60*1000); // refresh every 5 minutes
</script>
